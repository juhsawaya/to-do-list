name: Android — testes e evidências CP5
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/images/**'
      - 'EVIDENCIAS_EXCLUSAO.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            21
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK de compilação
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar e testar na JVM
        run: bash ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Executar testes instrumentados e capturar telas reais
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash ./gradlew connectedDebugAndroidTest --stacktrace
            mkdir -p docs/images/exclusao
            adb pull /sdcard/Android/data/carreiras.com.github.todolist/files/evidencias/. docs/images/exclusao/
      - name: Preparar documento de evidências
        run: python3 scripts/registrar_evidencias.py
      - name: Publicar evidências verificadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/exclusao/*.png EVIDENCIAS_EXCLUSAO.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: registrar cinco evidencias reais do emulador [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-android
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
            docs/images/exclusao/*.png
          retention-days: 14
